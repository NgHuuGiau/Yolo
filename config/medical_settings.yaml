medical:
  active_learning_enabled: false
  adamw_beta1: 0.9
  adamw_beta2: 0.999
  advanced:
    advanced_augmentation: true
    asl_clip: 0.05
    asl_gamma_neg: 4.0
    asl_gamma_pos: 0.0
    augmentation_strategy: rand_augment
    balanced_softmax_beta: 0.5
    checkpoint_averaging_window: 5
    cutmix_alpha: 1.0
    cutout_length: 16
    cutout_n_holes: 1
    ema_decay: 0.999
    enable_advanced_preprocessing: false
    enable_checkpoint_averaging: true
    enable_cutmix: true
    enable_cutout: true
    enable_ema: true
    enable_ensemble: true
    enable_gridmask: true
    enable_mc_dropout: false
    enable_mixup: true
    enable_multitask: true
    enable_segmentation_roi: false
    enable_self_supervised_pretrain: false
    enable_temperature_scaling: true
    ensemble_method: stacking
    ensemble_models:
    - efficientnet_v2_s
    - convnextv2_tiny
    - efficientnet_v2_m
    ensemble_weight_optimization: true
    focal_loss_gamma: 2.0
    focal_tversky_alpha: 0.7
    focal_tversky_beta: 0.3
    focal_tversky_gamma: 0.75
    gradient_accumulation_steps: 2
    gradient_clip_norm: 1.0
    gridmask_d1: 0.1
    gridmask_d2: 0.3
    ldam_loss_margin: 0.5
    ldam_loss_s: 30
    mc_dropout_samples: 20
    mixup_alpha: 0.2
    multitask_heads:
    - cancer_classification
    - modality_classification
    - anatomical_region
    - image_quality_score
    - tumor_presence
    rand_augment_m: 10
    rand_augment_n: 2
    segmentation_backend: unet
    self_supervised_backbone: vit_large_patch14_dinov2.lvd142m
    self_supervised_method: dinov2
  allow_fallback_model: false
  certainty_threshold: 0.3
  checkpoint_dir: output/medical/checkpoints
  classifier_backend: cnn
  classify_high_risk_threshold: 0.35
  classify_medium_risk_threshold: 0.25
  cnn_backbone: resnet18
  cnn_batch_size: 16
  cnn_checkpoint_averaging: true
  cnn_checkpoint_averaging_window: 5
  cnn_class_weighting: true
  cnn_dropout: 0.25
  cnn_early_stopping_patience: 15
  cnn_ema: true
  cnn_ema_decay: 0.999
  cnn_gradient_accumulation_steps: 4
  cnn_gradient_checkpointing: true
  cnn_gradient_clip_norm: 1.0
  cnn_image_size: 224
  cnn_label_smoothing: 0.08
  cnn_learning_rate: 0.00005
  cnn_mixed_precision: true
  cnn_num_epochs: 15
  cnn_optimizer: adamw
  cnn_pretrained: false
  cnn_scheduler: cosine_warmup_restart
  cnn_tta: true
  cnn_warmup_epochs: 3
  cnn_weight_decay: 0.0001
  conf_threshold: 0.25
  dataset_root: dataset/medical
  deterministic: true
  disease_name: medical_7_cancers
  early_stopping_metric: val_f1
  enable_duplicate_detection: true
  enable_modality_imbalance_handling: true
  enable_noisy_label_detection: true
  enable_progressive_resizing: false
  enable_stochastic_weight_averaging: false
  explainability_methods:
  - gradcam
  - gradcam_pp
  - eigen_cam
  - score_cam
  - attention_rollout
  fallback_model: null
  feature_size: 32
  hard_example_k: 0.3
  hard_example_mining: true
  image_size: 320
  kfold_num_folds: 5
  loss_function: focal_loss
  modality_reweight_factor: 1.5
  modality_tuning:
    ct:
      certainty_threshold: 0.5
      contrast_boost: 1.0
      medium_threshold: 0.4
      normalize: ct
      quality_threshold: 0.4
    default:
      certainty_threshold: 0.55
      contrast_boost: 1.0
      medium_threshold: 0.45
      normalize: default
      quality_threshold: 0.45
    endoscopy:
      certainty_threshold: 0.58
      contrast_boost: 1.1
      medium_threshold: 0.46
      normalize: endoscopy
      quality_threshold: 0.48
    eus:
      certainty_threshold: 0.64
      contrast_boost: 1.2
      medium_threshold: 0.52
      normalize: eus
      quality_threshold: 0.55
    mammogram:
      certainty_threshold: 0.62
      contrast_boost: 1.2
      medium_threshold: 0.5
      normalize: mammogram
      quality_threshold: 0.55
    mri:
      certainty_threshold: 0.5
      contrast_boost: 1.0
      medium_threshold: 0.4
      normalize: mri
      quality_threshold: 0.4
    pet_ct:
      certainty_threshold: 0.6
      contrast_boost: 1.1
      medium_threshold: 0.48
      normalize: pet_ct
      quality_threshold: 0.5
    ultrasound:
      certainty_threshold: 0.68
      contrast_boost: 1.3
      medium_threshold: 0.55
      normalize: ultrasound
      quality_threshold: 0.6
    xray:
      certainty_threshold: 0.55
      contrast_boost: 1.1
      medium_threshold: 0.45
      normalize: xray
      quality_threshold: 0.45
  model: models/pretrained/medical_7_cancers_cnn.pt
  brain_model: models/pretrained/brain_classifier.pt
  modality_model: models/pretrained/modality_classifier.pt
  yolo_model_path: models/trained/medical_yolo_detect.pt
  nested_cross_validation: false
  num_workers: 4
  optimizer: adamw
  output_root: output/medical
  overlay_dir: output/medical/processed_images
  patient_leakage_prevention: true
  pin_memory: true
  prefetch_factor: 2
  processed_dir: output/medical/normalized_images
  progressive_resizing_schedule:
  - 128
  - 224
  - 320
  pseudo_label_threshold: 0.95
  reports_dir: output/medical/reports
  scheduler: cosine_warmup_restart
  seed: 42
  submodel_dir: output/medical/submodels
  submodel_reweight_underrepresented: true
  swa_lr: 5.0e-05
  swa_start_epoch: 10
  tensorboard_dir: output/medical/tensorboard
  uncertainty_methods:
  - mc_dropout
  - deep_ensemble
  - temperature_scaling
  use_asl: false
  use_balanced_softmax: false
  use_focal_loss: true
  use_focal_tversky: false
  use_ldam: false
  validation_allowed_extensions:
  - .jpg
  - .jpeg
  - .png
  - .dcm
  - .nii
  - .nii.gz
  validation_metrics:
  - accuracy
  - sensitivity
  - specificity
  - precision
  - recall
  - f1
  - roc_auc
  - pr_auc
  - matthews_correlation
  - balanced_accuracy
  - calibration_error
  - ece
  validation_min_confidence: 0.7
  wandb_project: oncovision-medical
  weight_decay: 0.0001
